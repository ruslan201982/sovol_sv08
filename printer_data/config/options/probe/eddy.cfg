# Configuration for Eddy USB probe. Adapted for SV08 mainline from
# https://github.com/bigtreetech/Eddy/blob/master/sample-bigtreetech-eddy-homing.cfg
# (i.e., using Eddy for both bed mesh and probing, but without using the beta z-offset support).
#
# Follow the guide at https://github.com/bigtreetech/Eddy, but skipping everything
# about configuration except setting the serial path below. (In other words, do only
# mounting, firmware compilation and calibration.) You can find a mount # that allows you
# to fit the Eddy under the regular SV08 shroud (instead of the old probe, in the same place)
# at https://www.printables.com/model/968900-sovol-sv08-btt-eddy-mount.
# If you are connecting the probe in some other way, adjust x_offset and y_offset below
# (see the BTT guide for information).
#
# TODO: It would be nice to use the physical probe to automate the setup completely,
# but that probably requires a fair bit of scripting.

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_504450612039A61C-if00
restart_method: command

# [probe_eddy_ng btt_eddy]
# sensor_type: btt_eddy
# i2c_mcu: eddy
# i2c_bus: i2c0f
# x_offset: 0
# y_offset: 21.6

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
#   The sensor chip used to perform eddy current measurements. This
#   parameter must be provided and must be set to ldc1612.
#frequency:
#   The external crystal frequency (in Hz) of the LDC1612 chip.
#   The default is 12000000.
#intb_pin:
#   MCU gpio pin connected to the ldc1612 sensor's INTB pin (if
#   available). The default is to not use the INTB pin.
#max_sensor_hz:
#   Maximum expected resonant frequency reported by the sensor (in
#   Hz). This is used during internal clock rate configuration. This
#   value is typically only configured if the software reports a
#   warning suggesting the value should be increased. The default is
#   5000000.
descend_z: 2.0
#   The nominal distance (in mm) between the nozzle and bed that a
#   probing attempt should stop at. This parameter must be provided.
#i2c_address:
i2c_mcu: eddy
i2c_bus: i2c0f
#i2c_software_scl_pin:
#i2c_software_sda_pin:
#i2c_speed:
#   The i2c settings for the sensor chip. See the "common I2C
#   settings" section for a description of the above parameters.
x_offset: 0
y_offset: 21.6
#   The distance (in mm) between the probe and the nozzle along the
#   x and y axes. The default is 0.
#speed:
#lift_speed:
#samples:
#sample_retract_dist:
#samples_result:
#samples_tolerance:
#samples_tolerance_retries:
#   See the "probe" section for information on these parameters. Note
#   that the settings here apply only to regular probe commands. These
#   settings do not have an effect if using a probe "METHOD" of
#   "scan", "rapid_scan", or "tap".
#tap_threshold:
#   Descent stop threshold (in Hz/mm) for "tap" probing. Larger values
#   reduce the chance of the toolhead incorrectly stopping early due
#   to noise, while increasing the risk of the toolhead not correctly
#   stopping when it first contacts the bed. See Eddy_Probe.md for
#   more information. This value may be overridden at run-time using
#   the "TAP_THRESHOLD" parameter on probe commands.  The default is
#   to not enable "tap" probing.
#tap_z_offset: 0.0
#   The Z height (in mm) of the nozzle relative to the bed at the
#   contact point detected during "tap" probing. Nominally this would
#   be 0.0 to indicate the contact point has zero distance, but one
#   may set this to account for backlash, thermal expansion, a
#   systemic probing bias, or similar. The default is zero.


[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 2.0

# [quad_gantry_level]          
# gantry_corners:              
#     0,0
#     360,370
# points:
#     20,0         # левый нижний
#     20,305       # левый верхний (Y=305 вместо 315)
#     343,305      # правый верхний (Y=305 вместо 315)
#     343,0        # правый нижний
# speed: 120                   
# horizontal_move_z: 4       
# retry_tolerance: 0.025      
# retries: 5                  
# max_adjust: 30
[quad_gantry_level]
gantry_corners:
    0,0
    365,365
points:
    40,40          # Зонд: X=40,Y=40 (сопло: X=40,Y=18.4)
    40,300         # Зонд: X=40,Y=300 (сопло: X=40,Y=278.4)
    320,300        # Зонд: X=320,Y=300 (сопло: X=320,Y=278.4)
    320,40         # Зонд: X=320,Y=40 (сопло: X=320,Y=18.4)
    
    # # Учитываем реальный центр 180,170.5 и y_offset=24
    # # Минимальный Y для зонда: Y=24 (при сопле Y=0)
    #     # 1. Левый "нижний": X=30, Y=30
    # # Сопло: X=30, Y=6 (но Y=0 минимально)
    # 30,30
    #     # 2. Левый верхний: X=30, Y=311 (170.5+140.5=311)
    # # Сопло: X=30, Y=287
    # 30,311
    #     # 3. Правый верхний: X=330, Y=311
    # # Сопло: X=330, Y=287
    # 330,311
    #     # 4. Правый "нижний": X=330, Y=30
    # # Сопло: X=330, Y=6
    # 330,30
speed: 160
horizontal_move_z: 5
retry_tolerance: 0.025
retries: 5
max_adjust: 30

#[bed_mesh]
# speed: 150
# horizontal_move_z: 3
# mesh_min: 9.5,24          # X: 29.5 - 20 = 9.5
# mesh_max: 309.5,290       # X: 329.5 - 20 = 309.5
# probe_count: 15,15
# algorithm: bicubic
# bicubic_tension: 0.4
# split_delta_z: 0.016
# mesh_pps: 3,3
# adaptive_margin: 5
# fade_start: 0
# fade_end: 10
# fade_target: 0
# #scan_overshoot: 8  #uncomment this section if you still have room left over on the X axis for some scan overshoot to product smoother movements and more accurate scanning. Uncommenting this should be fine if you are using a standard voron mount.
[bed_mesh]
speed: 160
horizontal_move_z: 3
mesh_min: 25, 25          # Зонд: X=25,Y=25 (сопло: X=25,Y=3.4)
mesh_max: 330, 330        # Зонд: X=330,Y=330 (сопло: X=330,Y=308.4)
# Учитываем смещение центра
# mesh_min: 30, 30      # Зонд: X=30,Y=30
# mesh_max: 330, 311    # Зонд: X=330,Y=311 (макс Y)
probe_count: 15,15
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

# [homing_override]
# gcode:
#   # Move 5 up, just in case (this is our safety zhop, this needs 'set_position_z: 0' below)
#   G91 ; set relative positioning
#   G0 Z5 F1000 ; 5 up zhop
#   {% if not rawparams or 'Y' in rawparams %}
#     {action_respond_info('Homing Y')}
#     G28 Y
#     G90 ; set absolute positioning
#     G0 Y170.5 F6000 ; Реальный центр по Y
#     M400 ; Wait for move to finish
#   {% endif %}
#   {% if not rawparams or 'X' in rawparams %}
#     {action_respond_info('Homing X')}
#     G28 X
#     G90 ; set absolute positioning
#    G0 X180 F6000 ; Реальный центр по X
#     M400 ; Wait for move to finish
#   {% endif %}
#   {% if not rawparams or 'Z' in rawparams %}
#     {action_respond_info('Homing Z')}
#     G90 ; set absolute positioning
#     G0 X180 Y170.5 F6000 ; return to center  # ИЗМЕНИТЬ: 171.3 → 180.3
#     G28 Z                      ; do the coarse home
#     G90                        ; set absolute positioning
#     G0 Z2 F1000                ; to 2mm -- home height (or whatever you'd like), for maximum sensor accuracy
#     G4 S1                      ; chill for a sec
#     M400                       ; wait for move to finish
#     PROBE_EDDY_NG_PROBE_STATIC HOME_Z=1 ; read the current exact height from sensor and home Z to it
#     G0 Z5 F1000 ; to 5mm as home
#     M400 ; Wait for move to finish
#   {% endif %}
#   G90 ; set absolute positioning
# axes: xyz
# set_position_z: 0 # This forces the z position to be at 0 when we start homing, so we can move the Z up before homing.

[homing_override]
gcode:
  G91 ; относительное позиционирование
  G0 Z5 F1000 ; безопасный подъем Z (zhop) перед началом
  
  {% if not rawparams or 'Y' in rawparams %}
    {action_respond_info('Homing Y')}
    G28 Y
    G90 ; абсолютное позиционирование
    G0 Y170.5 F6000 ; Реальный центр по Y
    M400
  {% endif %}
  
  {% if not rawparams or 'X' in rawparams %}
    {action_respond_info('Homing X')}
    G28 X
    G90 ; абсолютное позиционирование
    G0 X180 F6000 ; Реальный центр по X
    M400
  {% endif %}
  
  {% if not rawparams or 'Z' in rawparams %}
    {action_respond_info('Homing Z')}
    G90 ; абсолютное позиционирование
    G0 X180 Y170.5 F6000 ; Перемещение в центр стола для точного гоминга Z
    G28 Z ; Официальное гоминг Z через виртуальный концевик Eddy (заменяет старый макрос)
    G0 Z10 F1000 ; Подъем на безопасную высоту после успешного гоминга
    M400
  {% endif %}
  
  G90 ; абсолютное позиционирование
axes: xyz
set_position_z: 0
